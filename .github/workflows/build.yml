name: Build Mod

on:
  push:
    branches: [ '1.21.1' ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: 'Minecraft 版本（覆盖 gradle.properties）'
        required: false
        default: '1.21.1'
      neo_version:
        description: 'NeoForge 版本（覆盖 gradle.properties）'
        required: false
        default: '21.1.219'

# 发 Release 需要写仓库内容的权限
permissions:
  contents: write

jobs:
  build:
    # 钉死到 24.04：GitHub 计划于 2026 年底把 ubuntu-latest 静默切到 26.04，
    # 提前固定可避免构建环境在新旧镜像间意外漂移
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        shell: bash
        run: |
          args=()
          if [[ -n "${{ inputs.minecraft_version }}" ]]; then
            args+=("-Pminecraft_version=${{ inputs.minecraft_version }}")
          fi
          if [[ -n "${{ inputs.neo_version }}" ]]; then
            args+=("-Pneo_version=${{ inputs.neo_version }}")
          fi
          echo "Build args: ${args[@]:-<default>}"
          ./gradlew build --no-daemon --stacktrace "${args[@]}"

      - name: Upload Jar (Artifacts)
        uses: actions/upload-artifact@v7
        with:
          name: phantomstaff-mod
          path: build/libs/*.jar

      # 仅当推送 v* 开头的 Tag 时，自动创建 GitHub Release 并附上 jar
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/*.jar
          generate_release_notes: true
