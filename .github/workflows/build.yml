name: Build Mod

on:
  push:
    branches: [ '1.21.1' ]
    tags: [ 'v*' ]
  workflow_dispatch:

# 发 Release 需要写仓库内容的权限
permissions:
  contents: write

jobs:
  build:
    # 钉死到 24.04：GitHub 计划于 2026 年底把 ubuntu-latest 静默切到 26.04，
    # 提前固定可避免构建环境在新旧镜像间意外漂移
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload Jar (Artifacts)
        uses: actions/upload-artifact@v7
        with:
          name: phantomstaff-mod
          path: build/libs/*.jar

      # 仅当推送 v* 开头的 Tag 时，自动创建 GitHub Release 并附上 jar
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/*.jar
          generate_release_notes: true
