plugins {
    id 'net.neoforged.moddev' version '1.0.20'
}

// ===== 版本号软编码：从 git tag 自动推导，发版只需推送 v* tag，无需手改 gradle.properties =====
// 1) 当前提交若正好指向某个 v* tag，直接用该 tag（去掉 v 前缀）作为版本号；
// 2) 否则（分支/提交，未打 tag）用「最近 v* tag + 短 sha」作为开发版（如 1.13.0-dev.a1b2c3d4）。
def gitVersion() {
    try {
        // 1) 当前提交正好指向某个 v* tag → 直接用它（去掉 v 前缀）作为发版版本号
        def tagProc = "git tag --points-at HEAD".execute()
        tagProc.waitFor()
        def vtag = tagProc.text.readLines().find { it.startsWith("v") }
        if (vtag) return vtag.substring(1)
        // 2) 否则（分支/提交，未打 tag）→ 用「最近 tag + 距离 + 短 sha」作为开发版（如 1.13.0-dev.a1b2c3d4）
        //    注意：不要用 --match v*，仓库根目录的 versions/ 会被 shell 当成通配符展开，导致匹配失败
        def descProc = "git describe --tags --abbrev=8".execute()
        descProc.waitFor()
        def desc = descProc.text.trim()
        if (desc) {
            def m = desc =~ /v?(\d+\.\d+\.\d+)(?:-(\d+)-g([0-9a-f]+))?.*/
            if (m.find()) {
                def base = m.group(1)
                def distance = m.group(2)
                def sha = m.group(3)
                if (distance && sha) return "${base}-dev.${sha}"
                return base
            }
        }
    } catch (Exception ignored) {}
    return "0.0.0-dev"
}

version = gitVersion()
group = mod_group

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// ===== 构建目标 =====
// 按 Minecraft 版本从 versions/{minecraft_version}.gradle 加载版本矩阵，
// 支持 -Pminecraft_version= 在 CI 面板中切换构建目标（多版本构建）
def buildTargetMinecraft = providers.gradleProperty("minecraft_version").getOrElse("1.21.1")
def matrixFile = file("versions/${buildTargetMinecraft}.gradle")
if (!matrixFile.exists()) {
    throw new GradleException("找不到版本矩阵文件：${matrixFile}（${buildTargetMinecraft} 不在支持列表内）")
}
apply from: matrixFile
assert hasProperty("buildTargetNeo") : "版本矩阵文件 ${matrixFile} 未定义 buildTargetNeo"
assert hasProperty("buildTargetMafglib") : "版本矩阵文件 ${matrixFile} 未定义 buildTargetMafglib"
def buildTargetNeo = providers.gradleProperty("neo_version").getOrElse(String.valueOf(rootProject.ext.buildTargetNeo))
def buildTargetMafglib = providers.gradleProperty("mafglib_version").getOrElse(String.valueOf(rootProject.ext.buildTargetMafglib))

neoForge {
    version = buildTargetNeo
    // ModDevGradle 默认使用 Mojang 官方映射

    // dev 运行配置（client/server/data），让 Minecraft 与依赖 mod 正确进入编译/运行 classpath
    runs {
        client { client() }
        server { server() }
        data { data() }
    }

    // 声明本 mod 的 sourceSet，确保 modding 依赖（Minecraft 映射、MaFgLib 等）注入编译 classpath
    mods {
        phantomstaff {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    // MaFgLib 从 Modrinth Maven 仓库获取
    exclusiveContent {
        forRepository {
            maven { url = "https://api.modrinth.com/maven" }
        }
        filter { includeGroup "maven.modrinth" }
    }
}

dependencies {
    // MaFgLib 是 MaLiLib 的 NeoForge 移植版，包名沿用 fi.dy.masa.malilib，
    // 因此配置/热键系统直接 import fi.dy.masa.malilib.* 即可，无需再引 malilib。
    implementation "maven.modrinth:mafglib:${buildTargetMafglib}"
}

tasks.register("printBuildTarget") {
    doLast {
        println("Build target: Minecraft ${buildTargetMinecraft} / NeoForge ${buildTargetNeo}")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 把计算出的版本号（及 modId/group）注入 neoforge.mods.toml 的占位符
processResources {
    def props = [mod_version: version, mod_id: mod_id, mod_group: mod_group]
    inputs.properties(props)
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(props)
    }
}
