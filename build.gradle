plugins {
    id 'net.neoforged.moddev' version '1.0.20'
}

version = mod_version
group = mod_group

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    // ModDevGradle 默认使用 Mojang 官方映射

    // dev 运行配置（client/server/data），让 Minecraft 与依赖 mod 正确进入编译/运行 classpath
    runs {
        client { client() }
        server { server() }
        data { data() }
    }

    // 声明本 mod 的 sourceSet，确保 modding 依赖（Minecraft 映射、MaFgLib 等）注入编译 classpath
    mods {
        phantomstaff {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    // MaFgLib 从 Modrinth Maven 仓库获取
    exclusiveContent {
        forRepository {
            maven { url = "https://api.modrinth.com/maven" }
        }
        filter { includeGroup "maven.modrinth" }
    }
}

dependencies {
    // MaFgLib 是 MaLiLib 的 NeoForge 移植版，包名沿用 fi.dy.masa.malilib，
    // 因此配置/热键系统直接 import fi.dy.masa.malilib.* 即可，无需再引 malilib。
    implementation "maven.modrinth:mafglib:0.4.3+mc1.21.1"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
