plugins {
    id 'net.neoforged.moddev' version '1.0.20'
}

version = mod_version
group = mod_group

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    // ModDevGradle 默认使用 Mojang 官方映射
}

repositories {
    mavenCentral()
    // MaFgLib 从 Modrinth Maven 仓库获取
    exclusiveContent {
        forRepository {
            maven { url = "https://api.modrinth.com/maven" }
        }
        filter { includeGroup "maven.modrinth" }
    }
}

dependencies {
    // 编译期 + 开发环境运行期可用；正式游戏内需单独安装 MaFgLib
    implementation "maven.modrinth:mafglib:0.4.3+mc1.21.1"
    // MaFgLib 在 Modrinth 上未把 MaLiLib 作为传递依赖发布，
    // 而本模组的配置/热键系统（fi.dy.masa.malilib.*）直接用到它，必须显式声明。
    implementation "maven.modrinth:malilib:0.21.10"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
