modLoader="javafml"
loaderVersion="[4.0,)"
license="MIT"

[[mods]]
modId="phantomstaff"
version="${mod_version}"
displayName="Phantom Staff"
description="面向 Create Aeronautics 物理结构的纯客户端辅助工具：高亮、追踪红线、屏幕边缘指向箭头，以及幽灵法杖槽位——按键把物理法杖盖入当前选中的快捷栏槽位并保留到物品栏刷新。"

[[dependencies.phantomstaff]]
modId="neoforge"
type="required"
versionRange="[21.1.219,)"
ordering="NONE"
side="CLIENT"

# Create / Create Aeronautics 都是「可选」：代码里对两者都做了运行时探测与降级
# （找不到物理法杖物品就提示并停用幽灵法杖槽位），因此不该在启动期硬拒绝加载。
# 版本范围也放宽——写死的 [6.0.10,) / [1.0,) 一旦与实际安装版本不符会直接拒绝进游戏。
[[dependencies.phantomstaff]]
modId="create"
type="optional"
versionRange="[6.0,)"
ordering="NONE"
side="CLIENT"

[[dependencies.phantomstaff]]
modId="simulated"
type="optional"
versionRange="[0.1,)"
ordering="NONE"
side="CLIENT"

[[dependencies.phantomstaff]]
modId="mafglib"
type="required"
versionRange="[0.4,)"
ordering="NONE"
side="CLIENT"
